name: Build Warehouse page and patch-needed list

on:
  push:
    branches: [v4]
    paths:
      - README.md
      - SaltySD/plugins/FPSLocker/patches/**
      - tools/**
      - .github/workflows/pages.yml
  schedule:
    - cron: '45 8 * * *'  # daily, after the CheckUpdate run
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for dates and recent patches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build page
        run: python -u tools/build_site.py --out _site

      - name: Update patch-needed issue
        if: github.repository == 'masagrator/FPSLocker-Warehouse' && github.event_name != 'push'
        continue-on-error: true  # never block the page deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_URL: https://masagrator.github.io/FPSLocker-Warehouse
        run: python -u tools/patch_needed.py

      - name: Upload page
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
