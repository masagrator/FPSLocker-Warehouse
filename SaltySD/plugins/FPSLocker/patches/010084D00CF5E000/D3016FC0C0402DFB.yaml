# NARUTO SHIPPUDEN: Ultimate Ninja STORM 4 ROAD TO BORUTO 1.3.0
# BID: D3016FC0C0402DFB
# FPS-independent game speed (frame skip): set any FPS target (20-60), FPS can be changed in-game.
# Logic always runs 60 steps/s; missing steps are run before each drawn frame.
# Gameplay timing = original 30 FPS game. Resolution unchanged (EdiZon cheats).
# Frame skip state lives in the unused tail of the game's .bss (main+0x498B9F00).
# Empty lines at the end are intentional: they keep the on-console YAML parser within the overlay memory.

