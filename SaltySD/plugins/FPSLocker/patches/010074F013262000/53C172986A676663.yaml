# Xenoblade Chronicles 3 3.0.0
# BID: 53C172986A676663

DECLARATIONS:
  -
    type: variable
    name: dr_target
    value_type: float
    default_value: 0.0166666666
    evaluate: "(1 / FPS_TARGET) / VSYNC_TARGET"
  -
    type: const
    name: default_frametime
    value: 0x3d088889
  - 
    type: code
    name: etherFix
    instructions: [
      [ldr, x21, [x0]],
      [mov, w8, $default_frametime],
      [movk, w8, $default_frametime, 16],
      [str, w8, [x21, 0x214]],
      [ret]
    ]    
MASTER_WRITE:
  # Redirect DR frametime target reading
  ## REF: 08 00 40 F9 08 65 40 F9 00 01 3F D6 88 02 40 B9, result with mov w8, 0x42800000 below in the same function, start from instruction before BLR X8 that is a part of result itself
  -
    type: asm_a64
    main_offset: 0x125016C
    instructions: [
      [adrp, x8, $dr_target],
      [ldr, s0, [x8, $dr_target]]
    ]
  # Fix crash when gathering big amount of ether for > 30 FPS
  # REF: A8 0A 41 F9 F4 03 00 AA, replace first LDR X21, [X0] above it
  -
    type: asm_a64
    main_offset: 0x67360
    instructions: [
      [bl, _etherFix()]
    ]
ALL_FPS:
  # vsync
  ## REF: 08 00 40 F9 08 65 40 F9 00 01 3F D6 88 02 40 B9, any result, search for ADRP + LDR X20 above
  -
    type: evaluate_write
    address: [MAIN, 0x1B43DB0]
    value_type: int32
    value: [VSYNC_TARGET, VSYNC_TARGET]
  # UI speed
  ## REF: 08 01 40 F9 08 2D 40 F9 49 09 40 F9 09 31 00 F9, ADRP + LDR above
  -
    type: evaluate_write
    address: [MAIN, 0x1BA2DD0, 128]
    address_unsafe: true
    value_type: float
    value: "1 / FPS_TARGET"
  -
    type: compare
    compare_address: [MAIN, 0x1BA2DD8]
    compare_type: "!="
    compare_value_type: int8
    compare_value: 0
    address: [MAIN, 0x1B43DB0]
    value_type: int32
    value: [2, 2]
  -
    type: compare
    compare_address: [MAIN, 0x1BA2DD8]
    compare_type: "!="
    compare_value_type: int8
    compare_value: 0
    address: [VARIABLE, dr_target]
    value: 0.0166666666
  -
    type: compare
    compare_address: [MAIN, 0x1BA2DD8]
    compare_type: "!="
    compare_value_type: int8
    compare_value: 0
    address: [MAIN, 0x1BA2DD0, 128]
    address_unsafe: true
    value_type: float
    value: 0.0333333333
  -
    type: compare
    compare_address: [MAIN, 0x1BA2DD8]
    compare_type: "!="
    compare_value_type: int8
    compare_value: 0
    value_type: refresh_rate
    value: 30