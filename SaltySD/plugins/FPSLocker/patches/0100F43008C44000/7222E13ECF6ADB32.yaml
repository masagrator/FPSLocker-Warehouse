# Pokémon Legends: Z-A 1.0.1
# BID: 7222E13ECF6ADB32

DECLARATIONS:
  -
    type: variable
    name: frametick
    value_type: uint64
    default_value: 0
  -
    type: const
    name: maxDelta
    value: 66666667
  -
    type: variable
    name: min_delta
    value_type: uint64
    default_value: 33333334
    evaluate: "FRAMETIME_TARGET * 1000000.02"
  -
    type: variable
    name: frametime
    value_type: uint64
    default_value: 0
  -
    type: code
    name: readDynamicFPS
    instructions: [
      [adrp, x10, $frametime],
      [ldr, x10, [x10, $frametime]],
      [cmp, x10, 0],
      [csel, x2, x2, x10, eq],
      [br, x3]
    ]
  -
    type: code
    name: dynamicFPS
    instructions: [
      [stp, x29, x30, [sp, -16], "!"],
      [mov, x29, sp],
      [blr, x8],
      [mrs, x11, cntpct_el0],
      [adrp, x10, $frametick],
      [ldr, x12, [x10, $frametick]],
      [str, x11, [x10, $frametick]],
      [mov, x10, x12],
      [cbz, x10, :goto1],
      [sub, x10, x11, x10],
      [mov, x11, 625],
      [mul, x10, x10, x11],
      [mov, x11, 12],
      [udiv, x10, x10, x11],
      [mov, x11, $maxDelta],
      [movk, x11, $maxDelta, 16],
      [cmp, x10, x11],
      [csel, x10, x10, x11, lt],
      [adrp, x11, $min_delta],
      [ldr, x11, [x11, $min_delta]],
      [cmp, x10, x11],
      [csel, x2, x10, x11, gt],
      [adrp, x10, $frametime],
      [str, x2, [x10, $frametime]],
      :goto1, [ldp, x29, x30, [sp], 16],
      [ret]

    ]
  -
    type: code
    name: setTo60FPSMode
    instructions: [
      [str, x0, [x26, 0x40]],
      [mov, w8, 0x100],
      [strh, w8, [x0, 0x20]],
      [ret]
    ]
  -
    type: code
    name: setTo60FPSMode2
    instructions: [
      [mov, w9, 0x100],
      [strh, w9, [x8, 0x20]],
      [ret]
    ]
MASTER_WRITE:
  # Restore original 30 FPS lock
  -
    type: asm_a64
    main_offset: 0x175E864
    instructions: [
      [mov, w1, 2]
    ]
  # Dynamic Resolution
  ## REF: 21 D8 61 5E 21 18 68 1E 00 18 61 1E, replace ADRP + ADD + LDR above it
  -
    type: asm_a64
    main_offset: 0xD5AB0
    instructions: [
      [adrp, x9, $min_delta],
      [ldr, d1, [x9, $min_delta]],
      [nop]
    ]
  # Calculate frame time by replacing call to nvnQueuePresentTexture
  -
    type: asm_a64
    main_offset: 0x175F154
    instructions: [
      [bl, _dynamicFPS()]
    ]
  # Replace reading hardcoded values
  ## REF: 02 D9 62 F8 08 00 40 F9 03 09 40 F9 60 00 1F D6, last REF. Check two other results if anything will go wrong somewhere
  -
    type: asm_a64
    main_offset: 0x2891B08
    instructions: [
      [b, _readDynamicFPS()]
    ]
  # Force game to start in 60 FPS mode for better game thread synchronization (writing 0 to 0x20) + enable constantly updating speed (writing 1 to 0x21)
  ## REF: 40 23 00 F9 08 04 40 F9
  -
    type: asm_a64
    main_offset: 0x19DD334
    instructions: [
      [bl, _setTo60FPSMode()]
    ]
  ## REF: D4 C2 94 1A 08 85 40 39
  -
    type: asm_a64
    main_offset: 0x19E37D4
    instructions: [
      [bl, _setTo60FPSMode2()]
    ]